<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bike Football</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #111;
            font-family: Arial, sans-serif;
        }

        #game {
            width: 100%;
            height: 100%;
            display: block;
        }

        #ui {
            position: fixed;
            top: 20px;
            left: 20px;
            color: white;
            background: rgba(0, 0, 0, 0.65);
            padding: 15px 20px;
            border-radius: 10px;
            z-index: 10;
            user-select: none;
        }

        #ui h1 {
            margin: 0 0 8px;
            font-size: 24px;
        }

        #ui p {
            margin: 4px 0;
        }

        #position {
            color: #ffd43b;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div id="ui">
        <h1>🏍️ Bike Football</h1>

        <p>Position: <span id="position">QB</span></p>

        <p>WASD — Move</p>
        <p>Mouse — Look</p>
        <p>Hold SPACE — Charge Jump</p>
        <p>F — Wheelie Boost</p>
<p>E — Pick Up Football</p>
<p>R — Throw Football</p>
    </div>

    <canvas id="game"></canvas>

    <script type="module" src="./game.js"></script>

</body>
</html>
